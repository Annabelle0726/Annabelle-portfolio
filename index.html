<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffcd39" />
    <meta name="description" content="Annabelle Zhu's portfolio of data science, web development and UX/UI design." />
    <link rel="icon" type="image/svg+xml" href="./src/assets/brand-mark.svg" />
    <title>Annabelle Zhu Portfolio</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .initial-hero { box-sizing: border-box; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 2rem; color: #173b6c; background: #FCFAF3; }
      .initial-hero h1 { margin: 0 0 .75rem; font-size: clamp(2.2rem, 5vw, 4rem); }
      .initial-hero h2 { margin: 0 0 1rem; font-size: 1.5rem; }
      .initial-hero p { margin: 0; font-size: 1.125rem; }
      .initial-hero .startup-notice { margin-top: 1.5rem; max-width: 38rem; line-height: 1.5; font-size: 1rem; }
      .initial-hero .startup-error { padding: .8rem 1rem; border-radius: .5rem; background: #fff9e6; }
    </style>
    <script>
      window.addEventListener('error', function (event) {
        if (!(event.target instanceof HTMLScriptElement) || event.target.type !== 'module') return;
        function showStartupError() {
          const error = document.getElementById('startup-error');
          if (!error) return;
          error.hidden = false;
          document.getElementById('startup-status').hidden = true;
          if (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            document.getElementById('startup-local-help').hidden = false;
          }
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showStartupError, { once: true });
        else showStartupError();
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <section id="hero" class="initial-hero">
        <div class="hero-container">
          <h2>我是</h2>
          <h1>Annabelle Zhu</h1>
          <p>软件开发 · 产品设计 · 数据科学</p>
          <p id="startup-status" class="startup-notice" role="status">Loading portfolio…</p>
          <p id="startup-error" class="startup-notice startup-error" role="alert" hidden>
            The portfolio could not load. Please refresh the page.
            <span id="startup-local-help" hidden> For local development, run <code>npm run dev</code> and open the URL shown in the terminal.</span>
          </p>
          <noscript><p class="startup-notice startup-error">Please enable JavaScript to view the full portfolio.</p></noscript>
        </div>
      </section>
    </div>
  </body>
</html>
